services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    command:
      [
        "sh",
        "-c",
        "python -m alembic upgrade head && exec uvicorn src.api.main:app --host 0.0.0.0 --port 8000"
      ]

    ports:
      - "8000:8000"

    environment:
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-sfmshop1}

      DB_PRIMARY_HOST: db
      DB_PRIMARY_PORT: 5432

      DB_REPLICA_HOST: db
      DB_REPLICA_PORT: 5432

      REDIS_HOST: redis
      REDIS_PORT: 6379

      MONGO_HOST: mongo
      MONGO_PORT: 27017

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672

      SECRET_KEY: ${SECRET_KEY:-development-secret-key}
      DEBUG: ${DEBUG:-False}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_started

    networks:
      - sfmshop_network

  db:
    image: postgres:15

    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-sfmshop1}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-sfmshop1}"
        ]
      interval: 5s
      timeout: 3s
      retries: 5

    networks:
      - sfmshop_network

  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    networks:
      - sfmshop_network

  rabbitmq:
    image: rabbitmq:3-management-alpine

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - sfmshop_network

  mongo:
    image: mongo:8

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

    networks:
      - sfmshop_network

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    command: ["python", "-m", "src.services.queue_consumer"]

    environment:
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-sfmshop1}
      DB_PRIMARY_HOST: db
      DB_PRIMARY_PORT: 5432
      DB_REPLICA_HOST: db
      DB_REPLICA_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      SECRET_KEY: ${SECRET_KEY:-development-secret-key}
      DEBUG: ${DEBUG:-False}

    depends_on:
      rabbitmq:
        condition: service_healthy

    networks:
      - sfmshop_network


volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  mongo_data:


networks:
  sfmshop_network:
    driver: bridge
