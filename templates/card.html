<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SFMShop - карточка товара</title>
    <style>
        .product-card {
            display: flex;
            flex-direction: column;
            width: 280px;
            padding: 20px;
            background-color: white;
            border: 1px solid #cccccc;
            border-radius: 10px;
        }

        .add-to-cart {
            padding: 10px;
            cursor: pointer;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
        }

        .add-to-cart:hover {
            background-color: #3d8b40;
        }
    </style>
</head>
<body>
    <div class="product-card">
        <h2>Ноутбук</h2>
        <p>Цена: 50 000 рублей</p>
        <button class="add-to-cart">
            В корзину
        </button>
    </div>
</body>
</html>
